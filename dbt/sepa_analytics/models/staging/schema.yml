version: 2

models:
  - name: stg_dim_comercios
    description: >
      Staging dimension for merchant chains and banners (e.g., Coto, Carrefour, Dia).
      Sourced from silver.dim_comercios. Append-only daily snapshot with fecha_vigencia,
      but not partitioned in Iceberg. ID columns are cast to STRING for the dbt contract.
    columns:
      - name: id_comercio
        description: "Merchant chain identifier. Composite snapshot key with id_bandera and fecha_vigencia."
        tests:
          - not_null
      - name: id_bandera
        description: "Banner/flag identifier within the chain."
      - name: cuit
        description: "Argentine tax identifier (CUIT) for the legal entity."
      - name: razon_social
        description: "Legal business name of the merchant."
      - name: bandera_nombre
        description: "Commercial banner name (e.g., 'Coto', 'Jumbo')."
      - name: bandera_url
        description: "URL of the official website for the banner."
      - name: fecha_vigencia
        description: "Snapshot business date."
        tests:
          - not_null

  - name: stg_dim_productos
    description: >
      Staging dimension for unique products with EAN codes and descriptions.
      Sourced from silver.dim_productos. Append-only daily snapshot with fecha_vigencia,
      but not partitioned in Iceberg. Product price/reference fields live on stg_precios,
      not this dimension.
    columns:
      - name: id_producto
        description: "Product identifier. Composite snapshot key with fecha_vigencia."
        tests:
          - not_null
      - name: ean
        description: "True when id_producto is a standard EAN/UPC-A code."
      - name: descripcion
        description: "Human-readable product name (e.g., 'Leche entera La Serenisima 1L'). 100% populated in Silver."
      - name: marca
        description: "Product brand (e.g., 'La Serenisima'). ~7.8% NULL in Silver -- upstream SEPA source omits brand for some products."
      - name: cantidad_presentacion
        description: "Numeric quantity in the standard presentation unit."
      - name: unidad_medida_presentacion
        description: "Unit of measure for the presentation (e.g., 'Kg', 'L', 'Un')."
      - name: fecha_vigencia
        description: "Snapshot business date."
        tests:
          - not_null

  - name: stg_dim_sucursales
    description: >
      Staging dimension for physical store branches with geolocation and contact data.
      Sourced from silver.dim_sucursales. Append-only daily snapshot with fecha_vigencia,
      but not partitioned in Iceberg.
      The provincia column is critical for mart_store_coverage aggregations.
      ID columns are cast to STRING to match the staging type contract.
    columns:
      - name: id_sucursal
        description: "Branch identifier. Cast from INT64 to STRING. Primary key (composite with fecha_vigencia in Silver)."
        tests:
          - not_null
      - name: id_comercio
        description: "Parent merchant chain. Cast from INT64 to STRING. Join key to stg_dim_comercios."
      - name: id_bandera
        description: "Parent banner. Cast from INT64 to STRING."
      - name: nombre
        description: "Store branch name or number as reported by the merchant."
      - name: tipo
        description: "Store format type (e.g., 'Hipermercado', 'Supermercado', 'Minorista')."
      - name: localidad
        description: "City or locality where the branch is located."
      - name: provincia
        description: "Argentine province code (e.g., 'AR-B' for Buenos Aires). Used as the grouping key in mart_store_coverage. NULL for some branches in the source."
      - name: codigo_postal
        description: "Argentine postal code."
      - name: latitud
        description: "Latitude coordinate of the branch. Cast from string to FLOAT64."
      - name: longitud
        description: "Longitude coordinate of the branch. Cast from string to FLOAT64."
      - name: fecha_vigencia
        description: "Snapshot business date."
        tests:
          - not_null

  - name: stg_precios
    description: >
      Staging fact table for daily price snapshots. Sourced from silver.precios (BigLake Iceberg),
      partitioned by fecha_vigencia. Product attributes (descripcion, marca, presentation)
      are denormalized onto the Silver fact for analytical queries.
      All ID columns are cast to STRING. Filter WHERE precio_lista > 0 recommended
      in marts; sentinel prices (0.01-0.10) exist in the upstream SEPA source.
    columns:
      - name: fecha_vigencia
        description: "Business date the price is valid. Partition key. Always use this column in WHERE clauses to trigger partition pruning."
        tests:
          - not_null
      - name: id_producto
        description: "Product identifier. Foreign key to stg_dim_productos.id_producto."
        tests:
          - not_null
      - name: id_sucursal
        description: "Branch identifier. Cast from INT64 to STRING. Foreign key to stg_dim_sucursales.id_sucursal."
        tests:
          - not_null
      - name: id_comercio
        description: "Merchant chain identifier. Cast from INT64 to STRING. Foreign key to stg_dim_comercios.id_comercio."
        tests:
          - not_null
      - name: id_bandera
        description: "Banner identifier within the chain. Cast from INT64 to STRING."
      - name: precio_lista
        description: "Listed retail price. Sentinel values (0.01-0.10) exist in upstream source. Apply WHERE precio_lista > 0 or >= 1.0 in marts."
      - name: precio_unitario_promo1
        description: "Promotional unit price for the first active offer. NULL when no promotion is active (~90% of rows)."
      - name: precio_unitario_promo2
        description: "Promotional unit price for the second active offer. NULL when no promotion is active."
      - name: scraped_at
        description: "Exact UTC timestamp when the scraper collected this record from the SEPA government server."
