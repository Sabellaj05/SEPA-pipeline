services:
  postgres:
    image: postgres:16-alpine
    container_name: sepa_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polaris}
      POSTGRES_DB: ${POSTGRES_DB:-polaris}
    volumes:
      - sepa_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - sepa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polaris} -d ${POSTGRES_DB:-polaris}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    container_name: sepa_rustfs
    image: rustfs/rustfs:latest
    user: "0:0"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-${MINIO_ACCESS_KEY:-Kwn71UgAjh*S6vweReK}}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${MINIO_SECRET_KEY:-!3ceZSXWfDKp#q*^y%ck}}
      RUSTFS_VOLUMES: /data/rustfs
    volumes:
      - rustfs_data:/data/rustfs
    networks:
      sepa_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  polaris-init:
    image: apache/polaris-admin-tool:latest
    container_name: sepa_polaris_init
    command: bootstrap -r default -c default,${POLARIS_CLIENT_ID:-polaris},${POLARIS_CLIENT_SECRET:-polaris}
    environment:
      - polaris.persistence.type=relational-jdbc
      - quarkus.datasource.db-kind=postgresql
      - quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polaris}
      - quarkus.datasource.username=${POSTGRES_USER:-polaris}
      - quarkus.datasource.password=${POSTGRES_PASSWORD:-polaris}
    networks:
      - sepa_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  polaris:
    image: apache/polaris:latest
    container_name: sepa_polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY:-${MINIO_ACCESS_KEY:-Kwn71UgAjh*S6vweReK}}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY:-${MINIO_SECRET_KEY:-!3ceZSXWfDKp#q*^y%ck}}
      - AWS_ENDPOINT_URL=http://172.20.0.10:9000
      - POLARIS_BOOTSTRAP_CREDENTIALS=default,${POLARIS_CLIENT_ID:-polaris},${POLARIS_CLIENT_SECRET:-polaris}
      - polaris.realm-context.realms=${POLARIS_REALM:-default}
      - polaris.features.ALLOW_SETTING_S3_ENDPOINTS=true
      - polaris.persistence.type=relational-jdbc
      - quarkus.datasource.db-kind=postgresql
      - quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-polaris}
      - quarkus.datasource.username=${POSTGRES_USER:-polaris}
      - quarkus.datasource.password=${POSTGRES_PASSWORD:-polaris}
      - quarkus.flyway.migrate-at-start=true
      - quarkus.otel.sdk.disabled=true
    volumes:
      - polaris_data:/data/polaris
    networks:
      - sepa_net
      - default
    depends_on:
      postgres:
        condition: service_healthy
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  sepa_pgdata:
  sepa_pgdata_test:
  rustfs_data:
  polaris_data:

networks:
  sepa_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
